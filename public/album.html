<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Album</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<header>
  <a class="back-btn" href="/">
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="10 12 6 8 10 4"/>
    </svg>
    All albums
  </a>
  <h1 id="header-title"></h1>
</header>

<main>
  <div id="album-content">
    <div class="loading">
      <div class="spinner"></div>
      Loading photos…
    </div>
  </div>
</main>

<div id="lightbox">
  <button id="lb-close" aria-label="Close">✕</button>
  <button class="lb-btn" id="lb-prev" aria-label="Previous">‹</button>
  <img id="lb-img" src="" alt="" />
  <button class="lb-btn" id="lb-next" aria-label="Next">›</button>
  <div id="lb-caption"></div>
</div>

<footer>
  <button class="contact-link" id="contact-open">Say Hi! Contact me</button>
</footer>

<div class="modal-overlay" id="contact-modal" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-heading">
    <button class="modal-close" id="contact-close" aria-label="Close">✕</button>
    <h2 id="modal-heading">Say Hi!</h2>
    <form id="contact-form" name="contact" data-netlify="true" netlify-honeypot="bot-field">
      <input type="hidden" name="form-name" value="contact" />
      <p class="honeypot"><label>Skip this: <input name="bot-field" tabindex="-1" autocomplete="off" /></label></p>
      <label for="cf-name">Name</label>
      <input type="text" id="cf-name" name="name" required autocomplete="name" />
      <label for="cf-email">Email</label>
      <input type="email" id="cf-email" name="email" required autocomplete="email" />
      <label for="cf-message">Message</label>
      <textarea id="cf-message" name="message" rows="4" required></textarea>
      <button type="submit" class="submit-btn">Send</button>
    </form>
    <p class="contact-success" id="contact-success" hidden>Thanks! I'll be in touch.</p>
  </div>
</div>

<script src="/js/app.js"></script>
<script src="/js/contact.js"></script>

</body>
</html>
